{% extends "base.html" %}

{% block content %}
<article class="editorial">
    <header class="editorial-header listing-header">
        <h1 id="search-heading">Search</h1>
        <p class="listing-kicker">Search public pages.</p>
    </header>
    <form class="site-search-form listing-search" role="search" action="/search/" method="get">
        <label class="listing-search-label" for="site-search-input">Search</label>
        <div class="listing-search-row">
            <input id="site-search-input" type="search" name="q" value="{{ query | default('') }}" autocomplete="off" spellcheck="false" aria-labelledby="search-heading">
            <button type="submit">Show results</button>
        </div>
    </form>
    <p class="listing-range" id="search-range"></p>
    <ul class="index-list" id="search-results">
        {% for item in items %}
        <li class="index-entry" data-search="{{ (item.title or '') | lower }} {{ (item.summary or '') | lower }}">
            <a href="{{ item.url }}" class="index-entry-title">{{ item.title }}</a>
            {% if item.summary %}
            <p>{{ item.summary }}</p>
            {% endif %}
        </li>
        {% endfor %}
    </ul>
    <p id="search-empty" hidden>No matching pages.</p>
</article>
<script>
(function () {
  var input = document.getElementById("site-search-input");
  var items = document.querySelectorAll("#search-results .index-entry");
  var empty = document.getElementById("search-empty");
  var bodyText = {};

  function normalize(value) {
    return String(value || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").replace(/\s+/g, " ").trim();
  }

  function terms(query) {
    return normalize(query).split(" ").filter(function (term) {
      return term.length > 1;
    });
  }

  function matches(hay, query) {
    var needles = terms(query);
    if (!needles.length) {
      return true;
    }
    var text = normalize(hay);
    return needles.every(function (term) {
      return text.indexOf(term) !== -1;
    });
  }

  function absorb(payload) {
    var docs = (payload && payload.documents) || [];
    docs.forEach(function (doc) {
      if (doc && doc.url) {
        bodyText[doc.url] = doc.searchable || doc.content || "";
      }
    });
    return bodyText;
  }

  function haystack(item) {
    var link = item.querySelector("a");
    var href = link ? (link.getAttribute("href") || "") : "";
    return (bodyText[href] || "") + " " + (item.getAttribute("data-search") || "");
  }

  function filter() {
    var query = input && input.value || "";
    var shown = 0;
    items.forEach(function (item) {
      var match = matches(haystack(item), query);
      item.hidden = !match;
      if (match) shown += 1;
    });
    if (empty) empty.hidden = shown !== 0;
    var range = document.getElementById("search-range");
    if (range) {
      range.textContent = terms(query).length && shown ? ("This is page 1, displaying results 1–" + shown + ".") : "";
    }
  }

  window.GangSearch = { matches: matches, absorb: absorb, filter: filter };

  if (input) {
    input.addEventListener("input", filter);
    if (input.value) filter();
  }

  if (typeof fetch === "function") {
    fetch("/search-index.json")
      .then(function (response) {
        return response.ok ? response.json() : null;
      })
      .then(function (payload) {
        if (payload) {
          absorb(payload);
          filter();
        }
      })
      .catch(function () {});
  }
})();
</script>
{% endblock %}
