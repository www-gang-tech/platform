<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; connect-src 'self'{% if comments_webhook_origin %} {{ comments_webhook_origin }}{% endif %}; base-uri 'self'; form-action 'self' https: https://*.n8n.app https://*.n8n.io;">
    <title>{{ title }} - {{ site_title }}</title>
    <meta name="description" content="{{ description }}">
    {% if canonical_url %}<link rel="canonical" href="{{ canonical_url }}">{% endif %}
    
    <!-- JSON-LD Structured Data -->
    {% if jsonld %}
    <script type="application/ld+json">
    {{ jsonld | tojson_script }}
    </script>
    {% endif %}
    
    <meta property="og:type" content="{{ og_type|default('website') }}">
    <meta property="og:title" content="{{ title }}">
    <meta property="og:description" content="{{ description }}">
    <meta name="twitter:card" content="summary">
    
    <!-- Resource Hints -->
    <link rel="preload" href="/assets/style.css" as="style">
    
    <link rel="stylesheet" href="/assets/style.css">
    
    {% if user_authenticated %}
    <!-- Editor resources (only for authenticated users) -->
    <link rel="preload" href="/assets/editor.css" as="style">
    <link rel="stylesheet" href="/assets/editor.css">
    {% endif %}
</head>
<body data-page-type="{{ page_type|default('page') }}" data-category="{{ category|default('') }}" data-slug="{{ slug|default('') }}">
    {% include "partials/header.html" %}
    
    <main role="main" id="content">
        {% block content %}{% endblock %}
    </main>
    
    {% include "partials/footer.html" %}

    {% if user_authenticated %}
    <!-- In-Place Editor (only for authenticated users) -->
            <button id="edit-trigger" class="edit-btn" onclick="activateEditor()" aria-label="Edit this page">
                Edit
            </button>
    <script src="/assets/editor-bundle.js" defer></script>
    {% endif %}
    
    {% if comments_enabled %}
    <script src="/assets/comments.js" defer></script>
    {% endif %}
</body>
</html>
