{% set path = current_path|default('') %}
<header class="site-header" role="banner">
    <div class="site-header-bar">
        <nav class="site-nav" role="navigation" aria-label="Main navigation">
            <ul>
                <li><a class="site-wordmark" href="/"{% if path == '/' %} aria-current="page"{% endif %}>GANG</a></li>
                <li><a href="/objects/"{% if path.startswith('/objects/') %} aria-current="page"{% endif %}>Objects</a></li>
                <li><a href="/studio/"{% if path.startswith('/studio/') %} aria-current="page"{% endif %}>Studio</a></li>
                <li><a href="/about/"{% if path.startswith('/about/') %} aria-current="page"{% endif %}>About</a></li>
                <li><a href="/research/"{% if path.startswith('/research/') %} aria-current="page"{% endif %}>Research</a></li>
                <li><a href="/journal/"{% if path.startswith('/journal/') %} aria-current="page"{% endif %}>Journal</a></li>
                <li><a href="/pages/contact/"{% if path == '/pages/contact/' %} aria-current="page"{% endif %}>Contact</a></li>
            </ul>
        </nav>
        <nav class="site-actions" aria-label="Search and updates">
            <a class="site-search" href="/search/"{% if current_path == '/search/' %} aria-current="page"{% endif %}>Search</a>
            <a href="/updates/"{% if current_path == '/updates/' %} aria-current="page"{% endif %}>Follow the work</a>
        </nav>
    </div>
</header>
