{% extends "base.html" %}

{% block content %}
<div class="index-layout listing">
    <header class="listing-header">
        <h1>{{ page_title }}</h1>
        {% if description %}
        <p class="listing-kicker">{{ description }}</p>
        {% endif %}
    </header>

    {% if items %}
    <ul class="index-list">
        {% for item in items %}
        {% include "partials/index_entry.html" %}
        {% endfor %}
    </ul>
    {% else %}
    <p>No {{ content_type }} found.</p>
    {% endif %}
</div>
{% endblock %}
