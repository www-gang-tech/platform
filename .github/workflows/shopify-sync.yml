name: Shopify Product Sync

on:
  # Webhook trigger from Shopify
  repository_dispatch:
    types: [shopify_product_update]
  
  # Manual trigger for bulk sync
  workflow_dispatch:
    inputs:
      product_handle:
        description: 'Product handle to sync (optional, syncs all if empty)'
        required: false

jobs:
  sync-product:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for PR base
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pyyaml requests beautifulsoup4
      
      - name: Extract product data
        id: extract
        env:
          # Pass via env to avoid shell metacharacter breakage from toJSON(...)
          PRODUCT_JSON: ${{ toJSON(github.event.client_payload.product) }}
          PRODUCT_HANDLE: ${{ github.event.client_payload.product.handle || github.event.inputs.product_handle }}
        run: |
          echo "handle=$PRODUCT_HANDLE" >> "$GITHUB_OUTPUT"
          mkdir -p .shopify-sync
          python3 -c 'import json,os; from pathlib import Path; raw=os.environ.get("PRODUCT_JSON") or "null"; Path(".shopify-sync/product.json").write_text(json.dumps(json.loads(raw), indent=2) if raw not in ("", "null") else "null")'
      
      - name: Convert to front-matter
        id: convert
        run: |
          python3 << 'EOF'
          import json
          import os
          import yaml
          from pathlib import Path
          from bs4 import BeautifulSoup
          
          # Load mapping schema
          with open('schemas/product.map.json') as f:
              schema = json.load(f)
          
          # Load product data
          with open('.shopify-sync/product.json') as f:
              product = json.load(f)
          
          if not product:
              print("No product data")
              raise SystemExit(1)
          
          def extract_value(data, path):
              parts = path.replace('[', '.').replace(']', '').split('.')
              value = data
              for i, part in enumerate(parts):
                  if part == '*':
                      if not isinstance(value, list):
                          return []
                      rest = '.'.join(parts[i + 1:])
                      return [extract_value(item, rest) for item in value]
                  if part.isdigit():
                      if not isinstance(value, list) or int(part) >= len(value):
                          return None
                      value = value[int(part)]
                  else:
                      value = value.get(part) if isinstance(value, dict) else None
                  if value is None:
                      return None
              return value

          def flatten(value):
              if isinstance(value, list):
                  flattened = []
                  for item in value:
                      if isinstance(item, list):
                          flattened.extend(item)
                      elif item is not None:
                          flattened.append(item)
                  return flattened
              return value

          def normalize_variants(value):
              if not isinstance(value, list):
                  return []
              normalized = []
              for variant in value:
                  if not isinstance(variant, dict):
                      continue
                  normalized.append({
                      'id': variant.get('id'),
                      'title': variant.get('title'),
                      'price': variant.get('price'),
                      'sku': variant.get('sku'),
                      'inventory': variant.get('inventory_quantity', 0),
                  })
              return normalized

          # Apply mappings
          front_matter = {}
          for _key, mapping in schema['mappings'].items():
              source = mapping['shopify_field']
              target = mapping['frontmatter_field']
              value = flatten(extract_value(product, source))
              
              # Apply transforms
              if value and mapping.get('transform') == 'html_to_markdown':
                  value = BeautifulSoup(str(value), 'html.parser').get_text()
              elif value is not None and mapping.get('transform') == 'normalize_variants':
                  value = normalize_variants(value)
              
              # Shopify tags arrive as a comma-separated string
              if target == 'tags' and isinstance(value, str):
                  value = [tag.strip() for tag in value.split(',') if tag.strip()]
              
              if value is None and 'default' in mapping:
                  value = mapping['default']
              
              if value is not None:
                  front_matter[target] = value
          
          # Generate front-matter file
          handle = front_matter.get('slug') or product.get('handle') or 'unknown'
          content_dir = Path('content/products')
          content_dir.mkdir(parents=True, exist_ok=True)
          
          output_file = content_dir / f"{handle}.md"
          
          with open(output_file, 'w') as f:
              f.write('---\n')
              yaml.dump(front_matter, f, default_flow_style=False, allow_unicode=True)
              f.write('---\n\n')
              f.write(front_matter.get('description', '') or '')
          
          print(f"Generated: {output_file}")
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"file={output_file}\n")
              f.write(f"handle={handle}\n")
          EOF
      
      - name: Prepare PR metadata
        id: pr_meta
        run: |
          echo "timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT
      
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: shop/update-${{ steps.convert.outputs.handle }}
          commit-message: "chore(shop): update product ${{ steps.convert.outputs.handle }}"
          add-paths: content/products/
          title: "🛍️ Update product: ${{ steps.convert.outputs.handle }}"
          body: |
            ## Shopify Product Update
            
            **Product**: `${{ steps.convert.outputs.handle }}`  
            **Synced at**: `${{ steps.pr_meta.outputs.timestamp }}`  
            **Shopify ID**: `${{ github.event.client_payload.product.id }}`
            
            ### Changes
            
            This PR updates the product front-matter from Shopify.
            
            **Review checklist**:
            - [ ] Product title is correct
            - [ ] Price matches Shopify
            - [ ] Images are loading
            - [ ] Description is appropriate
            - [ ] Inventory count is accurate
            
            ### Preview
            
            Build preview will be available after CI completes.
            
            ---
            
            *Auto-generated by Shopify sync workflow*
          labels: shopify-sync, automated-pr
          assignees: ${{ github.repository_owner }}
          draft: false

