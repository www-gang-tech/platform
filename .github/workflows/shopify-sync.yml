name: Shopify Product Sync

on:
  # Webhook trigger from Shopify
  repository_dispatch:
    types: [shopify_product_update]

  # Manual trigger for bulk sync
  workflow_dispatch:
    inputs:
      product_handle:
        description: 'Product handle to sync (optional, syncs all if empty)'
        required: false

jobs:
  sync-product:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for PR base

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml requests beautifulsoup4

      - name: Extract product data
        id: extract
        run: |
          # Parse webhook payload or fetch from Shopify API
          PRODUCT_HANDLE="${{ github.event.client_payload.product.handle || github.event.inputs.product_handle }}"
          echo "handle=$PRODUCT_HANDLE" >> $GITHUB_OUTPUT

          # Save product JSON (from webhook or API)
          mkdir -p .shopify-sync
          echo '${{ toJSON(github.event.client_payload.product) }}' > .shopify-sync/product.json

      - name: Convert to front-matter
        id: convert
        run: |
          python3 << 'EOF'
          import json
          import yaml
          from pathlib import Path
          from bs4 import BeautifulSoup
          from datetime import datetime

          # Load mapping schema
          with open('schemas/product.map.json') as f:
              schema = json.load(f)

          # Load product data
          with open('.shopify-sync/product.json') as f:
              product = json.load(f)

          if not product:
              print("No product data")
              exit(1)

          def get_path(data, path):
              value = data
              for raw_part in path.replace(']', '').split('.'):
                  if '[*]' in raw_part:
                      key = raw_part.replace('[*]', '')
                      items = value.get(key, []) if isinstance(value, dict) else []
                      remainder = path.split('[*].', 1)[1] if '[*].' in path else ''
                      return [get_path(item, remainder) for item in items] if remainder else items
                  if '[' in raw_part:
                      key, index = raw_part.split('[', 1)
                      value = value.get(key, []) if isinstance(value, dict) else []
                      value = value[int(index)] if isinstance(value, list) and len(value) > int(index) else None
                  else:
                      value = value.get(raw_part) if isinstance(value, dict) else None
                  if value is None:
                      return None
              return value

          # Apply mappings
          front_matter = {}
          for key, mapping in schema['mappings'].items():
              source = mapping['shopify_field']
              target = mapping.get('frontmatter_field', key)
              value = get_path(product, source)

              # Apply transforms
              if value and mapping.get('transform') in ('strip_html', 'html_to_markdown'):
                  value = BeautifulSoup(str(value), 'html.parser').get_text()[:mapping.get('max_length', 1000)]
              elif value and mapping.get('transform') == 'to_schema_availability':
                  value = 'InStock' if value else 'OutOfStock'

              if value is None and 'default' in mapping:
                  value = mapping['default']

              if value is not None:
                  front_matter[target] = value

          # Generate front-matter file
          import re
          handle = re.sub(r'[^a-z0-9-]+', '-', str(front_matter.get('slug') or product.get('handle') or 'unknown').lower()).strip('-')
          content_dir = Path('content/products')
          content_dir.mkdir(parents=True, exist_ok=True)

          output_file = content_dir / f"{handle}.md"

          with open(output_file, 'w') as f:
              f.write('---\n')
              yaml.dump(front_matter, f, default_flow_style=False, allow_unicode=True)
              f.write('---\n\n')
              f.write(front_matter.get('summary', ''))

          print(f"Generated: {output_file}")

          # Set outputs using environment file (new syntax)
          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"file={output_file}\n")
              f.write(f"handle={handle}\n")
          EOF

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: shop/update-${{ steps.convert.outputs.handle }}
          commit-message: "chore(shop): update product ${{ steps.convert.outputs.handle }}"
          title: "🛍️ Update product: ${{ steps.convert.outputs.handle }}"
          body: |
            ## Shopify Product Update

            **Product**: `${{ steps.convert.outputs.handle }}`
            **Shopify ID**: `${{ github.event.client_payload.product.id }}`

            ### Changes

            This PR updates the product front-matter from Shopify.

            **Review checklist**:
            - [ ] Product title is correct
            - [ ] Price matches Shopify
            - [ ] Images are loading
            - [ ] Description is appropriate
            - [ ] Inventory count is accurate

            ### Preview

            Build preview will be available after CI completes.

            ---

            *Auto-generated by Shopify sync workflow*
          labels: shopify-sync, automated-pr
          assignees: ${{ github.repository_owner }}
          draft: false

