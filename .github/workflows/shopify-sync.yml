name: Shopify Product Sync

on:
  # Webhook trigger from Shopify
  repository_dispatch:
    types: [shopify_product_update]
  
  # Manual trigger for bulk sync
  workflow_dispatch:
    inputs:
      product_handle:
        description: 'Product handle to sync (optional, syncs all if empty)'
        required: false

jobs:
  sync-product:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for PR base
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pyyaml requests beautifulsoup4
      
      - name: Extract product data
        id: extract
        env:
          # Pass via env to avoid shell metacharacter breakage from toJSON(...)
          PRODUCT_JSON: ${{ toJSON(github.event.client_payload.product) }}
          PRODUCT_HANDLE: ${{ github.event.client_payload.product.handle || github.event.inputs.product_handle }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: |
          echo "handle=$PRODUCT_HANDLE" >> "$GITHUB_OUTPUT"
          mkdir -p .shopify-sync
          python3 << 'PY'
          import json
          import os
          import sys
          from pathlib import Path

          import requests

          out = Path('.shopify-sync/product.json')
          raw = os.environ.get('PRODUCT_JSON') or 'null'
          handle = (os.environ.get('PRODUCT_HANDLE') or '').strip()
          store_raw = (os.environ.get('SHOPIFY_STORE') or '').strip()
          token = (os.environ.get('SHOPIFY_ACCESS_TOKEN') or '').strip()

          def normalize_store_host(value):
              value = (value or '').strip()
              if not value:
                  return ''
              # Accept host, https://host, or https://host/ trailing slash.
              from urllib.parse import urlparse
              if '://' in value:
                  parsed = urlparse(value)
              else:
                  parsed = urlparse(f'https://{value}')
              return (parsed.netloc or parsed.path or '').strip('/').lower()

          store = normalize_store_host(store_raw)

          product = None
          if raw not in ('', 'null'):
              product = json.loads(raw)
          elif store and token:
              base = f'https://{store}/admin/api/2024-01'
              headers = {
                  'X-Shopify-Access-Token': token,
                  'Content-Type': 'application/json',
              }
              if handle:
                  resp = requests.get(
                      f'{base}/products.json',
                      params={'handle': handle, 'limit': 1},
                      headers=headers,
                      timeout=30,
                  )
                  resp.raise_for_status()
                  products = resp.json().get('products') or []
                  product = products[0] if products else None
                  if product is None:
                      print(f'No Shopify product found for handle={handle}', file=sys.stderr)
                      raise SystemExit(1)
              else:
                  # Manual "sync all": paginate Admin API until exhausted.
                  products = []
                  url = f'{base}/products.json'
                  params = {'limit': 50}
                  from urllib.parse import urlparse
                  allowed_host = urlparse(base).netloc.lower()
                  while url:
                      resp = requests.get(
                          url,
                          params=params,
                          headers=headers,
                          timeout=30,
                      )
                      resp.raise_for_status()
                      batch = resp.json().get('products') or []
                      products.extend(batch)
                      next_url = None
                      link = resp.headers.get('Link') or resp.headers.get('link') or ''
                      for part in link.split(','):
                          if 'rel="next"' in part:
                              start = part.find('<')
                              end = part.find('>')
                              if start != -1 and end != -1:
                                  candidate = part[start + 1:end]
                                  # Never follow pagination off the configured
                                  # Shopify host (avoids leaking the access token).
                                  parsed = urlparse(candidate)
                                  if (
                                      parsed.scheme == 'https'
                                      and parsed.netloc.lower() == allowed_host
                                      and parsed.path
                                  ):
                                      next_url = candidate
                              break
                      url = next_url
                      params = None  # next Link URL already includes query params
                  if not products:
                      print('No Shopify products returned', file=sys.stderr)
                      raise SystemExit(1)
                  out.write_text(json.dumps({'products': products}, indent=2))
                  print(f'Fetched {len(products)} Shopify product(s) for bulk sync')
                  raise SystemExit(0)
          else:
              print(
                  'No product payload. Provide repository_dispatch product JSON '
                  'or set SHOPIFY_STORE + SHOPIFY_ACCESS_TOKEN for workflow_dispatch.',
                  file=sys.stderr,
              )
              raise SystemExit(1)

          out.write_text(json.dumps(product, indent=2) if product is not None else 'null')
          PY
      
      - name: Convert to front-matter
        id: convert
        run: |
          python3 << 'EOF'
          import json
          import os
          import yaml
          from pathlib import Path
          from urllib.parse import urlparse
          from bs4 import BeautifulSoup

          def normalize_store_host(value):
              value = (value or '').strip()
              if not value:
                  return ''
              if '://' in value:
                  parsed = urlparse(value)
              else:
                  parsed = urlparse(f'https://{value}')
              return (parsed.netloc or parsed.path or '').strip('/').lower()
          
          # Load mapping schema
          with open('schemas/product.map.json') as f:
              schema = json.load(f)
          
          # Load product data (single product or bulk {"products": [...]})
          with open('.shopify-sync/product.json') as f:
              payload = json.load(f)
          
          if not payload:
              print("No product data")
              raise SystemExit(1)

          if isinstance(payload, dict) and isinstance(payload.get('products'), list):
              products = [item for item in payload['products'] if isinstance(item, dict)]
          elif isinstance(payload, dict):
              products = [payload]
          else:
              print("Unexpected product payload shape")
              raise SystemExit(1)

          if not products:
              print("No product data")
              raise SystemExit(1)
          
          def extract_value(data, path):
              parts = path.replace('[', '.').replace(']', '').split('.')
              value = data
              for i, part in enumerate(parts):
                  if part == '*':
                      if not isinstance(value, list):
                          return []
                      rest = '.'.join(parts[i + 1:])
                      return [extract_value(item, rest) for item in value]
                  if part.isdigit():
                      if not isinstance(value, list) or int(part) >= len(value):
                          return None
                      value = value[int(part)]
                  else:
                      value = value.get(part) if isinstance(value, dict) else None
                  if value is None:
                      return None
              return value

          def flatten(value):
              if isinstance(value, list):
                  flattened = []
                  for item in value:
                      if isinstance(item, list):
                          flattened.extend(item)
                      elif item is not None:
                          flattened.append(item)
                  return flattened
              return value

          def normalize_variants(value):
              if not isinstance(value, list):
                  return []
              normalized = []
              for variant in value:
                  if not isinstance(variant, dict):
                      continue
                  raw_qty = variant.get('inventory_quantity', variant.get('inventory', 0))
                  try:
                      inventory_qty = int(raw_qty) if raw_qty is not None else 0
                  except (TypeError, ValueError):
                      inventory_qty = 0
                  inventory_management = variant.get('inventory_management')
                  inventory_policy = variant.get('inventory_policy', 'deny')
                  if inventory_management in (None, ''):
                      in_stock = True
                  elif inventory_policy == 'continue':
                      in_stock = True
                  else:
                      in_stock = inventory_qty > 0
                  option1 = str(variant.get('option1') or '').strip()
                  option2 = str(variant.get('option2') or '').strip()
                  option3 = str(variant.get('option3') or '').strip()
                  normalized.append({
                      'id': variant.get('id'),
                      'title': variant.get('title'),
                      'price': '0' if variant.get('price') in (None, '') else str(variant.get('price')),
                      'sku': variant.get('sku') or '',
                      'inventory': inventory_qty,
                      'availability': (
                          'https://schema.org/InStock'
                          if in_stock
                          else 'https://schema.org/OutOfStock'
                      ),
                      'option1': option1,
                      'option2': option2,
                      'option3': option3,
                      'color': option1,
                      'size': option2 or (str(variant.get('title') or '').strip() if not option1 else ''),
                      'material': option3,
                      'url': '',
                  })
              return normalized

          import re

          content_dir = Path('content/products').resolve()
          content_dir.mkdir(parents=True, exist_ok=True)
          handles = []
          output_files = []

          def safe_product_handle(raw):
              """Restrict handles to a single path segment under content/products."""
              handle = str(raw or '').strip()
              if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]*', handle):
                  raise SystemExit(f'Refusing unsafe Shopify product handle: {raw!r}')
              return handle

          for product in products:
              # Apply mappings
              front_matter = {}
              for _key, mapping in schema['mappings'].items():
                  source = mapping['shopify_field']
                  target = mapping['frontmatter_field']
                  value = flatten(extract_value(product, source))
                  
                  # Apply transforms
                  if value and mapping.get('transform') == 'html_to_markdown':
                      value = BeautifulSoup(str(value), 'html.parser').get_text()
                  elif value is not None and mapping.get('transform') == 'normalize_variants':
                      value = normalize_variants(value)
                  
                  # Shopify tags arrive as a comma-separated string
                  if target == 'tags' and isinstance(value, str):
                      value = [tag.strip() for tag in value.split(',') if tag.strip()]
                  
                  if value is None and 'default' in mapping:
                      value = mapping['default']
                  
                  if value is not None:
                      front_matter[target] = value

              # Admin product JSON has no top-level currency; honor env override.
              shop_currency = (
                  os.environ.get('SHOPIFY_CURRENCY')
                  or os.environ.get('SHOPIFY_SHOP_CURRENCY')
                  or ''
              ).strip()
              if shop_currency:
                  front_matter['currency'] = shop_currency
              elif not front_matter.get('currency'):
                  front_matter['currency'] = 'USD'
              
              # Generate front-matter file (path-safe handle only)
              handle = safe_product_handle(
                  front_matter.get('slug') or product.get('handle') or 'unknown'
              )
              front_matter['slug'] = handle
              store_host = normalize_store_host(os.environ.get('SHOPIFY_STORE') or '')
              for variant in front_matter.get('variants') or []:
                  if not isinstance(variant, dict):
                      continue
                  vid = variant.get('id')
                  if store_host and vid and not variant.get('url'):
                      variant['url'] = (
                          f'https://{store_host}/products/{handle}?variant={vid}'
                      )
                      variant['buy_url'] = variant['url']
              output_file = (content_dir / f'{handle}.md').resolve()
              try:
                  output_file.relative_to(content_dir)
              except ValueError as exc:
                  raise SystemExit(f'Handle escaped products dir: {handle!r}') from exc
              
              with open(output_file, 'w') as f:
                  f.write('---\n')
                  yaml.dump(front_matter, f, default_flow_style=False, allow_unicode=True)
                  f.write('---\n\n')
                  f.write(front_matter.get('description', '') or '')
              
              print(f"Generated: {output_file}")
              handles.append(handle)
              output_files.append(str(output_file))
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"file={output_files[0]}\n")
              f.write(f"handle={handles[0] if len(handles) == 1 else 'bulk-' + str(len(handles))}\n")
          EOF
      
      - name: Prepare PR metadata
        id: pr_meta
        run: |
          echo "timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT
      
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: shop/update-${{ steps.convert.outputs.handle }}
          commit-message: "chore(shop): update product ${{ steps.convert.outputs.handle }}"
          add-paths: content/products/
          title: "🛍️ Update product: ${{ steps.convert.outputs.handle }}"
          body: |
            ## Shopify Product Update
            
            **Product**: `${{ steps.convert.outputs.handle }}`  
            **Synced at**: `${{ steps.pr_meta.outputs.timestamp }}`  
            **Shopify ID**: `${{ github.event.client_payload.product.id }}`
            
            ### Changes
            
            This PR updates the product front-matter from Shopify.
            
            **Review checklist**:
            - [ ] Product title is correct
            - [ ] Price matches Shopify
            - [ ] Images are loading
            - [ ] Description is appropriate
            - [ ] Inventory count is accurate
            
            ### Preview
            
            Build preview will be available after CI completes.
            
            ---
            
            *Auto-generated by Shopify sync workflow*
          labels: shopify-sync, automated-pr
          assignees: ${{ github.repository_owner }}
          draft: false

