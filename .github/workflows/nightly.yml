name: nightly
on:
  schedule: [{ cron: "30 2 * * *" }]  # 2:30am UTC
  workflow_dispatch: {}
jobs:
  run-nightly:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.txt
      - run: pip install -e ./cli/gang
      - name: Run AI optimization
        if: env.ANTHROPIC_API_KEY != ''
        run: gang optimize
      - name: Build & audit
        run: |
          gang image public --check-alt
          gang build
          gang check --output validation-report.json
          gang check-contracts --verbose
          gang audit
      - name: Answerability report
        run: gang report --answerability --format html
      - name: CrUX snapshot
        run: node scripts/crux_snapshot.js
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
      - name: Archive fresh URLs
        run: node scripts/archive.js
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-reports
          path: |
            runs/**/*.json
            reports/**
            validation-report.json
