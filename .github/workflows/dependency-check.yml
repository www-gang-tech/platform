name: Weekly Dependency Check

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install pip-audit
        run: pip install pip-audit
      
      - name: Check for security vulnerabilities
        id: audit
        run: |
          pip-audit -r requirements.txt --format=json > audit-report.json || echo "VULNERABILITIES_FOUND=true" >> $GITHUB_ENV
      
      - name: Create issue if vulnerabilities found
        if: env.VULNERABILITIES_FOUND == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('audit-report.json', 'utf8'));
            const vulnerabilities = [];
            for (const dep of report.dependencies || []) {
              for (const vuln of dep.vulns || []) {
                vulnerabilities.push({ dependency: dep, vulnerability: vuln });
              }
            }
            
            let body = '## 🚨 Security Vulnerabilities Detected\n\n';
            body += 'The weekly security scan found vulnerabilities in dependencies:\n\n';
            
            for (const item of vulnerabilities) {
              const dep = item.dependency;
              const vuln = item.vulnerability;
              const fixes = (vuln.fix_versions || []).join(', ') || 'No fixed version reported';
              body += `### ${dep.name} ${dep.version}\n`;
              body += `- **Vulnerability**: ${vuln.id || vuln.aliases?.join(', ') || 'unknown'}\n`;
              body += `- **Fix**: ${fixes}\n`;
              body += `- **Details**: ${vuln.description || vuln.summary || 'No description provided'}\n\n`;
            }
            
            body += '**Action Required**: Run `gang update-deps --security-only` to fix these issues.\n';
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Security vulnerabilities detected in dependencies',
              body: body,
              labels: ['security', 'dependencies']
            });
      
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: audit-report.json

