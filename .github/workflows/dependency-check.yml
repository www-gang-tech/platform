name: Weekly Dependency Check

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install pip-audit
        run: pip install pip-audit
      
      - name: Check for security vulnerabilities
        id: audit
        run: |
          set +e
          pip-audit -r requirements.txt --format=json > audit-report.json
          AUDIT_STATUS=$?
          pip-audit -r apps/studio/backend/requirements.txt --format=json > studio-audit-report.json
          STUDIO_STATUS=$?
          set -e
          if [ "$AUDIT_STATUS" -ne 0 ] || [ "$STUDIO_STATUS" -ne 0 ]; then
            echo "VULNERABILITIES_FOUND=true" >> "$GITHUB_ENV"
          fi
      
      - name: Create issue if vulnerabilities found
        if: env.VULNERABILITIES_FOUND == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reports = [];
            for (const file of ['audit-report.json', 'studio-audit-report.json']) {
              if (!fs.existsSync(file)) continue;
              try {
                reports.push(JSON.parse(fs.readFileSync(file, 'utf8')));
              } catch (err) {
                core.warning(`Could not parse ${file}: ${err.message}`);
              }
            }

            const findings = [];
            for (const report of reports) {
              const deps = report.dependencies || [];
              for (const dep of deps) {
                const vulns = dep.vulns || dep.vulnerabilities || [];
                if (!vulns.length) continue;
                findings.push({
                  name: dep.name || dep.package || 'unknown',
                  version: dep.version || '',
                  vulns
                });
              }
            }

            if (!findings.length) {
              core.info('pip-audit reported a non-zero exit but no parseable vulnerabilities.');
              return;
            }

            let body = '## 🚨 Security Vulnerabilities Detected\n\n';
            body += 'The weekly security scan found vulnerabilities in dependencies:\n\n';

            for (const finding of findings) {
              body += `### ${finding.name} ${finding.version}\n`;
              for (const vuln of finding.vulns) {
                const aliases = (vuln.aliases || []).join(', ');
                const fixes = (vuln.fix_versions || []).join(', ') || 'none listed';
                body += `- **ID**: ${vuln.id || 'unknown'}${aliases ? ` (${aliases})` : ''}\n`;
                body += `- **Fix**: Upgrade to ${fixes}\n`;
                if (vuln.description) {
                  body += `- **Details**: ${vuln.description}\n`;
                }
                body += '\n';
              }
            }

            body += '**Action Required**: Review and upgrade the affected packages.\n';
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Security vulnerabilities detected in dependencies',
              body: body,
              labels: ['security', 'dependencies']
            });

      - name: Fail on vulnerabilities
        if: env.VULNERABILITIES_FOUND == 'true'
        run: |
          echo "pip-audit reported vulnerabilities"
          exit 1
      
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: |
            audit-report.json
            studio-audit-report.json

