name: Weekly Dependency Check

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install pip-audit
        run: pip install pip-audit
      
      - name: Check for security vulnerabilities
        id: audit
        run: |
          pip-audit -r requirements.txt --format=json > audit-report.json || echo "VULNERABILITIES_FOUND=true" >> $GITHUB_ENV
      
      - name: Create issue if vulnerabilities found
        if: env.VULNERABILITIES_FOUND == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('audit-report.json', 'utf8'));
            const dependencies = Array.isArray(report) ? report : (report.dependencies || []);
            const vulnerabilities = dependencies.flatMap(dep =>
              (dep.vulns || dep.vulnerabilities || []).map(vuln => ({
                name: dep.name,
                version: dep.version,
                id: vuln.id || vuln.vulnerability_id || 'unknown',
                aliases: vuln.aliases || [],
                fixVersions: vuln.fix_versions || vuln.fixes || [],
                description: vuln.description || vuln.summary || 'No description provided.'
              }))
            );
            
            if (vulnerabilities.length === 0) {
              core.info('pip-audit reported a failure, but no vulnerabilities were present in the JSON report.');
              return;
            }
            
            let body = '## 🚨 Security Vulnerabilities Detected\n\n';
            body += 'The weekly security scan found vulnerabilities in dependencies:\n\n';
            
            for (const vuln of vulnerabilities) {
              body += `### ${vuln.name} ${vuln.version}\n`;
              body += `- **ID**: ${vuln.id}\n`;
              if (vuln.aliases.length > 0) {
                body += `- **Aliases**: ${vuln.aliases.join(', ')}\n`;
              }
              body += `- **Fix**: ${vuln.fixVersions.length > 0 ? `Upgrade to ${vuln.fixVersions.join(', ')}` : 'No fixed version reported'}\n`;
              body += `- **Details**: ${vuln.description}\n\n`;
            }
            
            body += '**Action Required**: Run `gang update-deps --security-only` to fix these issues.\n';
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Security vulnerabilities detected in dependencies',
              body: body,
              labels: ['security', 'dependencies']
            });
      
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: audit-report.json

